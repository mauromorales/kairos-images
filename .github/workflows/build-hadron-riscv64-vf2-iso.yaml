name: 'Make the ISO of the Hadron riscv64 VisionFive 2 image'

# The Hadron riscv64 base is built by hand (nodes/hadron-riscv64-vf2/README.md) and the
# image is pushed to quay.io/mauromorales/kairos-riscv64. This workflow only turns a
# pushed image into a live ISO with AuroraBoot and makes one DRAFT release. Nothing is
# public until the draft is published by hand.
on:
  pull_request:
    paths:
      - 'nodes/hadron-riscv64-vf2/**'
      - '.github/workflows/build-hadron-riscv64-vf2-iso.yaml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag in quay.io/mauromorales/kairos-riscv64 (for example hadron-v0.7.0-standard-riscv64-visionfive2-0.1.0-k0sv1.36.4)'
        required: true
        type: string
      release_version:
        description: 'Version of the image, as in its tag (for example 0.1.0)'
        required: true
        type: string

permissions:
  contents: write # only used to create the draft release

jobs:
  # Runs on pull requests: the ISO job needs a pushed image, so a pull request only
  # checks that the Dockerfile parses and that the workflow is valid YAML.
  lint:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Dockerfile check
        run: docker buildx build --check --build-arg BASE=alpine nodes/hadron-riscv64-vf2
      - name: Workflow is valid YAML
        run: python3 -c "import yaml,sys; yaml.safe_load(open('.github/workflows/build-hadron-riscv64-vf2-iso.yaml'))"

  iso:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    env:
      IMAGE_TAG: ${{ inputs.image_tag }}
      VERSION: ${{ inputs.release_version }}
    steps:
      - name: Check the tag
        run: |
          case "$IMAGE_TAG$VERSION" in *[!A-Za-z0-9._+-]*|'') echo "image_tag and release_version may only hold letters, digits and . _ + -" >&2; exit 1;; esac
          case "$VERSION" in *[!0-9.]*|''|.*|*.|*..*) echo "release_version must be like 0.1.0" >&2; exit 1;; esac
          # hadron-v<hadron>-standard-riscv64-visionfive2-<version>-k0sv<k0s>
          re='^hadron-(v[0-9][0-9.]*)-standard-riscv64-visionfive2-([0-9][0-9.]*)-k0sv([0-9][0-9.]*)$'
          [[ "$IMAGE_TAG" =~ $re ]] || { echo "tag must look like hadron-v0.7.0-standard-riscv64-visionfive2-$VERSION-k0sv1.36.4" >&2; exit 1; }
          [ "${BASH_REMATCH[2]}" = "$VERSION" ] || { echo "release_version $VERSION is not the version in the tag (${BASH_REMATCH[2]})" >&2; exit 1; }
          {
            echo "IMAGE=quay.io/mauromorales/kairos-riscv64:$IMAGE_TAG"
            echo "HADRON_VERSION=${BASH_REMATCH[1]}"
            echo "K0S_VERSION=${BASH_REMATCH[3]}"
          } >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      # Pulling by platform does not need QEMU: AuroraBoot only reads the filesystem.
      - name: Pull the image
        run: docker pull --platform linux/riscv64 "$IMAGE"
      - name: Checkout AuroraBoot
        uses: actions/checkout@v6
        with:
          repository: mauro-agent/AuroraBoot
          ref: fix/riscv64-raw-efi-no-shim
          path: auroraboot-src
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auroraboot-src/go.mod
      - name: Install AuroraBoot build and ISO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev squashfs-tools xorriso dosfstools mtools
      - name: Build AuroraBoot
        working-directory: auroraboot-src
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep
          go build -ldflags "-X main.version=v0.0.0-riscv64-node" -o ../auroraboot .
      - name: Build ISO
        run: |
          mkdir -p output
          name="kairos-$IMAGE_TAG"
          echo "ISO_NAME=$name" >> "$GITHUB_ENV"
          sudo ./auroraboot --debug build-iso --arch riscv64 --output ./output/ \
            --override-name "$name" "docker:$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -l output
          size=$(stat -c %s "output/$name.iso")
          # GitHub rejects release assets of 2 GiB or more.
          if [ "$size" -ge 2147483648 ]; then
            echo "ISO is $size bytes, over the 2 GiB release asset limit" >&2
            exit 1
          fi
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="hadron-riscv64-vf2-k0s-v${VERSION}"
          sha256="$(cut -d' ' -f1 "output/$ISO_NAME.iso.sha256")"
          df=nodes/hadron-riscv64-vf2/Dockerfile
          kairos="$(grep -oP '^ARG KAIROS_VERSION=\K.*' $df)"
          k0s_release="$(grep -oP '^ARG K0S_RISCV64_RELEASE=\K.*' $df)"
          cat > notes.md <<NOTES
          EXPERIMENT. Hadron-based image for the StarFive VisionFive 2 (JH7110, riscv64) with k0s. Not booted on the board yet. Not an official Kairos or Hadron release.

          | Component | Version |
          |---|---|
          | Board | StarFive VisionFive 2 |
          | Base | Hadron ${HADRON_VERSION} (a commit of \`main\` after the tag, see nodes/hadron-riscv64-vf2/README.md), built by hand for riscv64 |
          | provider-kairos | Kairos ${kairos} riscv64 release |
          | k0s | v${K0S_VERSION}+k0s.0, unofficial riscv64 build, release \`${k0s_release}\` of this repository (not an official k0s release) |
          | Display | none from the kernel: use serial or SSH |

          Container image: \`${IMAGE}\`
          ISO SHA256: \`${sha256}\`

          Install: follow steps 1 to 4 of nodes/kairos-riscv64-vf2/README.md, with two changes. In step 2 take the ISO from this release, not from the Ubuntu one. In step 4 skip the HDMI GRUB entry: this kernel has no display patches and there is no \`/boot/dtb\`. Wait for the install to finish before you cut the power. Its example cloud-config is for k3s: write a \`k0s:\` or \`k0s-worker:\` stanza instead.
          NOTES
          gh release create "$tag" \
            "output/$ISO_NAME.iso" "output/$ISO_NAME.iso.sha256" \
            --draft --prerelease \
            --title "Hadron riscv64 VisionFive 2 v${VERSION} (k0s, experimental)" \
            --notes-file notes.md
