name: 'Build Kairos riscv64 VisionFive 2 image'

# Builds nodes/kairos-riscv64-vf2/Dockerfile for riscv64. The kernel stage
# cross-compiles on the runner; the image stage runs under QEMU. Pushes to
# quay.io only from main; pull requests just validate the build.
#
# A release is a manual workflow_dispatch with release_version set (for
# example 0.1.0). It builds and pushes the image, makes a live ISO from it
# with AuroraBoot, and creates one DRAFT GitHub Release per image, named
# kairos-riscv64-vf2-k3s-v<version> and kairos-riscv64-vf2-k0s-v<version>.
# Nothing is public until a draft is published by hand.
on:
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/kairos-riscv64-vf2/**'
      - '.github/workflows/build-kairos-riscv64-vf2.yaml'
  pull_request:
    paths:
      - 'nodes/kairos-riscv64-vf2/**'
      - '.github/workflows/build-kairos-riscv64-vf2.yaml'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version for a draft GitHub Release (for example 0.1.0). Leave empty to only build.'
        required: false
        type: string

# Two images, one per Kubernetes distribution, built from the k3s and k0s targets of the
# Dockerfile. `version` is the Kubernetes version that the image reports. Bump it together
# with K3S_RISCV64_RELEASE (k3s) or the K0S_RISCV64_* arguments (k0s) in the Dockerfile.

permissions:
  contents: write # only used to create the draft release

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: k3s
            version: '1.36.3'
          - distro: k0s
            version: '1.36.4'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Login to Quay
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Our own version, not Kairos's: the release input, or 0.0.0-<sha> for a
      # plain build. The Kairos and k0s versions are in the Dockerfile and the
      # release notes. Tags are never moved or reused.
      - name: Determine version
        id: version
        run: |
          if [ -n "${{ inputs.release_version }}" ]; then
            echo "value=${{ inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
          # One Quay repo for every riscv64 image; the tag says what it is,
          # in the same order as the ISO name.
          version="$(grep '^value=' "$GITHUB_OUTPUT" | cut -d= -f2)"
          echo "oci_tag=ubuntu-24.04-standard-riscv64-visionfive2-${version}-${{ matrix.distro }}v${{ matrix.version }}" >> "$GITHUB_OUTPUT"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
          target: ${{ matrix.distro }}
          platforms: linux/riscv64
          file: nodes/kairos-riscv64-vf2/Dockerfile
          context: nodes/kairos-riscv64-vf2
          tags: |
            quay.io/mauromorales/kairos-riscv64:${{ steps.version.outputs.oci_tag }}
          cache-from: type=gha,scope=kairos-riscv64-vf2-${{ matrix.distro }}
          cache-to: type=gha,mode=max,scope=kairos-riscv64-vf2-${{ matrix.distro }}
          push: ${{ github.event_name != 'pull_request' }}

  release:
    if: ${{ inputs.release_version != '' }}
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: k3s
            version: '1.36.3'
          - distro: k0s
            version: '1.36.4'
    env:
      VERSION: ${{ inputs.release_version }}
      DISTRO: ${{ matrix.distro }}
      DISTRO_VERSION: ${{ matrix.version }}
    steps:
      - name: Set the image name
        run: echo "IMAGE=quay.io/mauromorales/kairos-riscv64:ubuntu-24.04-standard-riscv64-visionfive2-${VERSION}-${DISTRO}v${DISTRO_VERSION}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v6

      - name: Login to Quay
        uses: docker/login-action@v3
        with:
          registry: quay.io
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      # Pulling by platform does not need QEMU: the image is only stored,
      # AuroraBoot reads its filesystem and never runs it.
      - name: Pull the image
        run: docker pull --platform linux/riscv64 "$IMAGE"

      # The same AuroraBoot build as the generic riscv64 workflow. See the
      # comments there for why it is built from source.
      - name: Checkout AuroraBoot
        uses: actions/checkout@v6
        with:
          repository: mauro-agent/AuroraBoot
          ref: fix/riscv64-raw-efi-no-shim
          path: auroraboot-src

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: auroraboot-src/go.mod

      - name: Install AuroraBoot build and ISO dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpcsclite-dev squashfs-tools xorriso dosfstools mtools

      - name: Build AuroraBoot
        working-directory: auroraboot-src
        run: |
          mkdir -p internal/ui/dist
          touch internal/ui/dist/.gitkeep
          go build -ldflags "-X main.version=v0.0.0-riscv64-node" -o ../auroraboot .

      - name: Build ISO
        run: |
          mkdir -p output
          name="kairos-ubuntu-24.04-standard-riscv64-visionfive2-${VERSION}-${DISTRO}v${DISTRO_VERSION}"
          echo "ISO_NAME=$name" >> "$GITHUB_ENV"
          sudo ./auroraboot --debug build-iso --arch riscv64 --output ./output/ \
            --override-name "$name" "docker:$IMAGE"
          sudo chown -R "$(id -u):$(id -g)" output
          ls -l output
          size=$(stat -c %s "output/$name.iso")
          # GitHub rejects release assets of 2 GiB or more.
          if [ "$size" -ge 2147483648 ]; then
            echo "ISO is $size bytes, over the 2 GiB release asset limit" >&2
            exit 1
          fi

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="kairos-riscv64-vf2-${DISTRO}-v${VERSION}"
          df=nodes/kairos-riscv64-vf2/Dockerfile
          kairos="$(grep -oP '^ARG KAIROS_VERSION=\K.*' $df)"
          if [ "$DISTRO" = k0s ]; then
            distro_row="| k0s | v${DISTRO_VERSION}+k0s.0, unofficial riscv64 build of the upstream tag, release \`$(grep -oP '^ARG K0S_RISCV64_RELEASE=\K.*' $df)\` of this repository (not an official k0s release; ran under QEMU only) |"
          else
            distro_row="| k3s | v${DISTRO_VERSION}, CARV-ICS-FORTH fork release $(grep -oP '^ARG K3S_RISCV64_RELEASE=\K.*' $df) (not an official k3s release) |"
          fi
          kernel="$(grep -oP '^ARG KERNEL_TAG=\K.*' $df)"
          sha256="$(cut -d' ' -f1 "output/$ISO_NAME.iso.sha256")"
          cat > notes.md <<NOTES
          Community image for the StarFive VisionFive 2 (JH7110, riscv64) with HDMI. Not an official Kairos release. Tracking: kairos-io/kairos#4635.

          | Component | Version |
          |---|---|
          | Board | StarFive VisionFive 2 (v1.3B tested) |
          | Kairos | ${kairos} |
          ${distro_row}
          | Kernel | Linux ${kernel} plus the unmerged JH7110 display patches |
          | Base | Ubuntu 24.04 |

          Container image: \`${IMAGE}\`
          ISO SHA256: \`${sha256}\`

          ## Install

          1. Update U-Boot and OpenSBI in the board's SPI flash to 2025.10 (the factory 2021.10 cannot read USB).
          2. Write the ISO to a USB stick and boot the board from it.
          3. Over SSH or the serial console run \`kairos-agent manual-install --device /dev/sdX cloud-config.yaml\` with your own SSH key in the file (\`cloud-config.yaml\` for k0s, \`cloud-config-k3s.yaml\` for k3s).
          4. Wait for it to finish, remove the stick and reboot. At the GRUB prompt type the HDMI entry from \`kernel/grubmenu\` to get the display.

          The live ISO has no display output. Use serial or SSH until the installed system boots with the HDMI entry. Full steps and limitations: nodes/kairos-riscv64-vf2/README.md.
          NOTES
          gh release create "$tag" \
            "output/$ISO_NAME.iso" "output/$ISO_NAME.iso.sha256" \
            --draft --prerelease \
            --title "Kairos riscv64 VisionFive 2 v${VERSION} (Ubuntu 24.04, Kairos ${kairos}, ${DISTRO} v${DISTRO_VERSION})" \
            --notes-file notes.md
