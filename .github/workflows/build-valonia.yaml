name: 'Build valonia image (Hadron, Raspberry Pi 4, k0s)'

# valonia is the ARM64 worker of the belgica cluster. This builds a Kairos Hadron raw
# disk image for the Raspberry Pi 4 with k0s, with the Kairos factory action. There is no
# custom base image: it starts from the Hadron base that Kairos publishes. A push or pull
# request builds with an expiring tag. A release is a manual run with a tag.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Durable image tag, e.g. v0.6.3-rpi4-k0s-v1.36.4-r1. Leave empty for an expiring test tag.'
        required: false
        type: string
  push:
    branches:
      - 'main'
    paths:
      - 'nodes/valonia/**'
      - '.github/workflows/build-valonia.yaml'
  pull_request:
    paths:
      - 'nodes/valonia/**'
      - '.github/workflows/build-valonia.yaml'

permissions:
  contents: write
  security-events: write
  id-token: write
  actions: read
  packages: write

jobs:
  valonia:
    name: Kairos Factory
    uses: kairos-io/kairos-factory-action/.github/workflows/reusable-factory.yaml@e2108928941a741b690e3f879f46e5f0706ae565 # v1.4.5
    secrets:
      registry_username: ${{ secrets.REGISTRY_USERNAME }}
      registry_password: ${{ secrets.REGISTRY_PASSWORD }}
    with:
      base_image: ghcr.io/kairos-io/hadron:v0.6.3
      model: "rpi4"
      arch: "arm64"
      kubernetes_distro: "k0s"
      # The version that hegemonikon runs. Check that it is a k0s release the factory can fetch.
      kubernetes_version: "v1.36.4+k0s.0"
      version: ${{ inputs.tag != '' && inputs.tag || 'v0.0.0-test' }}
      raw: true
      sbom: false
      security_scan_mode: "report-only"
      registry_domain: "quay.io"
      registry_namespace: "mauromorales"
      registry_repository: "valonia"
      summary_artifacts: true
      custom_tag_format: "$VERSION"
      custom_artifact_format: "valonia-$VERSION-$ARCH-$COMMIT_SHA"
      custom_job_name_format: "valonia"
      image_labels: ${{ inputs.tag == '' && 'quay.expires-after=2d' || '' }}
