#cloud-config

hostname: "kairos-vf2"

users:
  - name: kairos
    groups: ["admin"]
    # Replace with your own public key. There is no default password on purpose.
    ssh_authorized_keys:
      - "ssh-ed25519 AAAA... you@example"

k3s:
  enabled: true
  args:
    - --write-kubeconfig-mode=644
    - --disable=traefik
    # The root filesystem is an overlay; containerd's overlayfs snapshotter
    # cannot stack on it. See ../kairos-riscv64/README.md.
    - --snapshotter=native

# Trust the fleet console, same as the other nodes. Without it the
# phone-home registration fails TLS verification. Public certificate only.
# The registration token is NOT here: it is a secret, see README.md (Fleet).
stages:
  initramfs:
    - name: "Trust the apps.home.arpa CA-2"
      files:
        # Public CA certificate only. The fleet console (fleet.home.arpa)
        # serves a certificate from this CA.
        - path: /usr/local/share/ca-certificates/apps-home-arpa-ca-2.crt
          permissions: 0644
          owner: 0
          group: 0
          content: |
            -----BEGIN CERTIFICATE-----
            MIIBojCCAUegAwIBAgIUXk6O0RUfU5ZidRo0a23MITtsEYQwCgYIKoZIzj0EAwIw
            HjEcMBoGA1UEAwwTYXBwcy5ob21lLmFycGEtY2EtMjAeFw0yNjEwMjUxMzM4MTha
            Fw0zNjEwMjIxMzM4MThaMB4xHDAaBgNVBAMME2FwcHMuaG9tZS5hcnBhLWNhLTIw
            WTATBgcqhkjOPQIBBggqhkjOPQMBBwNCAAQyzfL3fhaluoSf65aNOtbG9MNBcUqL
            Q6oJmNFKduB+1t34dXcmmFjATMTx1oxrJNTmhcBOEQ3fU7ysYCyIVGKHo2MwYTAf
            BgNVHSMEGDAWgBTA9LECzAP/M6ZCJxVoTTO/RlEwFTAPBgNVHRMBAf8EBTADAQH/
            MA4GA1UdDwEB/wQEAwIBBjAdBgNVHQ4EFgQUwPSxAswD/zOmQicVaE0zv0ZRMBUw
